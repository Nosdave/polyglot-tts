# Dependabot — angelegt 09.10.2026.
# Monatlich und gruppiert, damit nicht jede Abhaengigkeit einen eigenen PR erzeugt.
# Hinweis: Dependabot-ALERTS sind davon unabhaengig und muessen in den
# Repo-Einstellungen unter Security aktiviert werden.
version: 2
updates:
  # GitHub-Actions: haelt u.a. actions/checkout aktuell (v4 zielt auf Node 20 = EOL)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
